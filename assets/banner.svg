<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes floatDash {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseRing {
      0% { r: 6px; opacity: 0.8; }
      50% { r: 18px; opacity: 0; }
      100% { r: 6px; opacity: 0.8; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 950px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 200px 280px; }
    .stream-line { stroke-dasharray: 8 12; animation: floatDash 4s linear infinite; }
    .wave-line { animation: waveMove 6s ease-in-out infinite; }
    .beacon { animation: pulseRing 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="980" cy="110" r="150" fill="#6366f1" filter="url(#softGlow)" />
  <circle class="orb-2" cx="160" cy="270" r="130" fill="#06b6d4" filter="url(#softGlow)" />
  <circle cx="1080" cy="260" r="90" fill="#a855f7" filter="url(#softGlow)" opacity="0.3" />

  <!-- Dynamic Circuit / Graph Lines (Right/Background area) -->
  <g opacity="0.45">
    <path class="stream-line" d="M 680,40 L 760,110 L 900,110 L 980,180 L 1150,180" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="stream-line" d="M 720,320 L 840,250 L 980,250 L 1050,180 L 1180,180" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <path class="wave-line" d="M 780,180 C 860,120 940,240 1020,180 C 1100,120 1160,200 1200,170" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Data Graph Nodes -->
    <circle cx="760" cy="110" r="4" fill="#38bdf8" />
    <circle cx="900" cy="110" r="5" fill="#38bdf8" />
    <circle cx="980" cy="180" r="7" fill="#818cf8" />
    <circle cx="840" cy="250" r="5" fill="#818cf8" />
    <circle cx="980" cy="250" r="4" fill="#c084fc" />
    <circle cx="1050" cy="180" r="5" fill="#38bdf8" />

    <!-- Pulse beacon on central node -->
    <circle class="beacon" cx="980" cy="180" r="8" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Foreground Badge / Pill -->
  <g transform="translate(80, 52)">
    <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <circle cx="20" cy="17" r="9" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ENTERPRISE ECOSYSTEM</text>
  </g>

  <!-- Main Title (Foreground, crisp & prominent) -->
  <g transform="translate(80, 142)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
      Awesome Org Configuration
    </text>
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#primaryGrad)">
      Optimization
    </text>
  </g>

  <!-- Subtitle (Foreground, crisp & readable) -->
  <g transform="translate(80, 245)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#94a3b8">
      Curated Technical Debt Analysis, Metadata Optimization, Drift Detection &amp; SaaS Org Health
    </text>
  </g>

  <!-- Feature Tags / Metric Highlights (Foreground Footer) -->
  <g transform="translate(80, 288)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">⚡ Metadata Intelligence</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(192, 0)">
      <rect width="170" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#818cf8">🛡️ Technical Debt Audit</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(374, 0)">
      <rect width="165" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#c084fc">🚀 CI/CD &amp; Drift Control</text>
    </g>
  </g>
</svg>
